trigger:
- main


stages:
  - stage: python
    displayName: python setup
    jobs:
      - job: python
        displayName: download and create env for python
        pool:
         vmImage: 'windows-latest'
        steps:
          - checkout: self
          - task: AzureCLI@2
            inputs:
              azuresubscription: "justpracticerepo"
              scriptType: 'bash'
              scriptLocation: scriptpath
              scriptPath: projects/demo/python.py


