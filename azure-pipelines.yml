trigger:
- main


stages:
  - stage: python
    displayName: python setup
    jobs:
      - job: python
        displayName: download and create env for python
        pool:
         vmImage: 'windows-latest'
        steps:
          - task: AzureCLI@2
            inputs:
              azuresubscription: "justpracticerepo"
              scriptType: 'bash'
              scriptLocation: inlineScript
              inlineScript: |
                git clone -b dev https://github.com/Thiru799/taxi-booking.git temp_project
                ls
                mkdir -p /d/Projects/demo 
                cp -r temp_project/* /d/Projects/demo
                ls /d/Projects/demo/
                python3 -m venv dev
                ls
                echo "Activating virtual environment..."
                source dev/Scripts/activate
                curl https://pypi.org/simple
                # if [ $? -eq 0 ]; then
                #     echo "Project setup completed successfully."
                # else
                #     echo "Project setup failed."
                #     exit 1
                # fi
          
          # - task: AzureCLI@2
          #   inputs:
          #     azureSubscription: 'justpracticerepo'
          #     scriptType: 'bash'
          #     scriptLocation: 'inlineScript'
          #     inlineScript: |
          #       python3 -m venv dev
          #       ls
          #       echo "Activating virtual environment..."
          #       source dev/Scripts/activate
          #       curl https://pypi.org/simple
          #       pip install --prefer-binary -r requirements.txt
          #       if [ $? -eq 0 ]; then
          #           echo "Project setup completed successfully."
          #       else
          #           echo "Project setup failed."
          #           exit 1
          #       fi
          #       export HTTPS_PROXY=http://proxy.its.hpecorp.net:8080
          #       env | grep -i proxy
          
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
              addToPath: true
              architecture: 'x64'
          - script: |
              python -m pip install --upgrade pip setuptools wheel
              pip install --prefer-binary -r requirements.txt
          - script: |
              echo Python dependencies installed successfully! 
              displayName: 'Success Message'
              condition: succeeded()
